<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b4332">
  <title>결과확인 · 문경관광공사 공직비위 익명신고센터</title>
  <meta name="description" content="신고번호와 비밀번호로 처리 경과와 결과를 확인하세요.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main" class="skip-link">본문 바로가기</a>

  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="index.html" aria-label="홈">
        <span class="logo-mark">문</span>
        <span class="brand-text"><b>문경관광공사</b><span>공직비위 익명신고센터</span></span>
      </a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="site-nav" aria-label="주 메뉴">
        <ul>
          <li><a href="index.html">센터 안내</a></li>
          <li><a href="report.html">신고하기</a></li>
          <li><a href="result.html" class="active">결과확인</a></li>
          <li><a href="faq.html">자주 묻는 질문</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">홈</a> › 결과확인</div>
        <h1>신고 처리결과 확인</h1>
        <p>접수 시 발급받은 신고번호와 비밀번호를 입력하세요.</p>
      </div>
    </section>

    <div class="container form-wrap">
      <div class="form-card">
        <div class="notice">
          <span class="ic">🔑</span>
          <div>신고번호와 비밀번호는 <b>본인만 보관</b>하고 있는 정보입니다. 분실 시 보안을 위해 재발급이 불가능하니 주의하세요.</div>
        </div>

        <div class="form-error" id="lookupError" role="alert"></div>

        <form id="lookupForm" novalidate>
          <div class="field">
            <label for="code">신고번호<span class="req">*</span></label>
            <input type="text" id="code" name="code" required placeholder="예: MG-2026-ABC123" autocomplete="off">
          </div>
          <div class="field">
            <label for="pw">비밀번호<span class="req">*</span></label>
            <input type="password" id="pw" name="pw" required placeholder="접수 시 설정한 비밀번호">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">조회하기</button>
        </form>

        <!-- 조회 결과 -->
        <div id="resultView" hidden>
          <div class="status-card">
            <div class="top">
              <b>신고번호 <span id="rCode">—</span></b>
              <span class="badge review" id="rBadge">—</span>
            </div>
            <div class="body">
              <p style="color:var(--ink-soft);margin-bottom:8px;font-size:.92rem;" id="rTitle"></p>
              <div class="sec-title" style="font-weight:800;color:var(--forest-900);margin:14px 0 8px;">처리 이력</div>
              <ul class="timeline" id="rTimeline"></ul>
              <div class="sec-title" style="font-weight:800;color:var(--forest-900);margin:18px 0 8px;">담당자와의 소통</div>
              <div id="rMessages"></div>
              <div class="field" style="margin-top:14px;">
                <label for="replyBox" style="font-size:.9rem;">담당자에게 추가 메시지 보내기(선택)</label>
                <textarea id="replyBox" maxlength="4000" placeholder="추가로 전달할 내용이 있으면 작성하세요."></textarea>
                <button type="button" class="btn btn-primary" id="replyBtn" style="margin-top:10px;">메시지 전송</button>
                <span id="replyMsg" class="hint" style="margin-left:10px;"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="copy">© <span data-year></span> 문경관광공사 공직비위 익명신고센터</div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script>
    (function () {
      var form = document.getElementById('lookupForm');
      var err = document.getElementById('lookupError');
      var view = document.getElementById('resultView');
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var fmt = function (t) { return (t || '').replace('T', ' ').slice(0, 16); };
      var badgeClass = { received: 'received', review: 'review', investigating: 'review', done: 'done', rejected: 'done' };
      var curCode, curPw;

      function render(d) {
        curCode = d.reportNo; curPw = document.getElementById('pw').value;
        document.getElementById('rCode').textContent = d.reportNo;
        var badge = document.getElementById('rBadge');
        badge.textContent = d.statusLabel;
        badge.className = 'badge ' + (badgeClass[d.status] || 'review');
        document.getElementById('rTitle').textContent = '제목: ' + d.title;
        document.getElementById('rTimeline').innerHTML = d.timeline.map(function (t) {
          return '<li><span class="d">' + esc(t.label) + '</span><span class="t">' + fmt(t.at) + '</span></li>'; }).join('');
        var mv = document.getElementById('rMessages');
        mv.innerHTML = d.messages.length ? d.messages.map(function (m) {
          return '<div class="notice" style="margin-bottom:8px;background:' + (m.sender === 'admin' ? 'var(--forest-100)' : '#fff') +
            ';border-color:var(--line);"><div><b>' + (m.sender === 'admin' ? '담당자' : '신고자') + '</b> · ' +
            fmt(m.at) + '<br>' + esc(m.body) + '</div></div>'; }).join('')
          : '<p class="hint">아직 담당자 메시지가 없습니다.</p>';
        form.hidden = true; view.hidden = false;
        view.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.classList.remove('show');
        var code = document.getElementById('code').value.trim();
        var pw = document.getElementById('pw').value;
        if (!/^MG-\d{4}-[A-Z0-9]{6}$/i.test(code)) {
          err.textContent = '신고번호 형식이 올바르지 않습니다. (예: MG-2026-ABC123)';
          err.classList.add('show'); return;
        }
        fetch('/api/reports/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reportNo: code, password: pw }) })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.d.error || '조회 중 오류가 발생했습니다.');
            render(res.d);
          })
          .catch(function (e2) { err.textContent = e2.message; err.classList.add('show'); });
      });

      document.getElementById('replyBtn').addEventListener('click', function () {
        var box = document.getElementById('replyBox');
        var note = document.getElementById('replyMsg');
        if (!box.value.trim()) { note.textContent = '내용을 입력하세요.'; return; }
        fetch('/api/reports/message', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reportNo: curCode, password: curPw, body: box.value.trim() }) })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.d.error || '전송 실패');
            box.value = ''; note.textContent = '전송되었습니다. 새로고침하여 조회하면 반영됩니다.';
          })
          .catch(function (e3) { note.textContent = e3.message; });
      });
    })();
  </script>
</body>
</html>
